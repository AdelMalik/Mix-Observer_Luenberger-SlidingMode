[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lure-observer"
version = "0.1.0"
description = "Combined LMI-based observer for Lur'e systems with virtual output reconstruction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "cvxpy[clarabel]>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ipython",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]
